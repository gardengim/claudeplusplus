[package]
name = "claudeplusplus"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
ratatui = "0.30.2"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
signal-hook = "0.4.5"
unicode-width = "0.2.2"
vt100 = "0.18.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
