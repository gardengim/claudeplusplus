[package]
name = "claudeplusplus"
version = "0.1.0"
edition = "2024"
description = "A light native terminal front-end for Claude Code: tabs, panels and an embedded editor over headless `claude -p`"
license = "MIT"
readme = "README.md"
keywords = ["claude", "claude-code", "tui", "terminal"]
categories = ["command-line-utilities"]
# Not for crates.io: the name claude++ is not a valid crate name, and it is built from source (install.sh).
publish = false

[dependencies]
libc = "0.2"
ratatui = "0.30.2"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
signal-hook = "0.4.5"
unicode-width = "0.2.2"
vt100 = "0.18.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
